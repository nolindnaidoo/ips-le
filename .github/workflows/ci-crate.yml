# The Rust CLI's CI.
#
# This repo is crate-only: there is no extension beside it yet, so the `parity`
# and `differential` jobs the two-frontend siblings run have nothing to compare
# and are deliberately absent rather than present and vacuous. They arrive with
# the extension.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a commit with
  # no way to be verified. Dispatch is the escape hatch.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
  pull_request:
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Whether anything the Rust jobs depend on actually moved. "Docs" is
  # deliberately narrow — *.md, LICENSE and the agent instruction files —
  # and anything unrecognised, or an unreadable diff, counts as code. The
  # default is always to run more, never less.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            range="$before..HEAD"
          fi

          if ! files="$(git diff --name-only "$range")"; then files=""; fi

          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | LICENSE | .cursorrules | .windsurfrules | .clinerules) ;;
              .cursor/* | .github/copilot-instructions.md) ;;
              *) code=true; break ;;
            esac
          done <<EOF
          $files
          EOF

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code, files changed:"
          echo "$files"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `#[expect]` is `#[allow]` that complains when it stops being
      # needed. It is still an inline suppression, and a gate that greps
      # for one spelling and not the other is a gate that gets routed
      # around by accident — this crate carried an `#[expect(dead_code)]`
      # under a green policy job. `tests/` is included: the rule is
      # crate-wide, and a test is not an exemption.
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rnE '#!?\[[^]]*\b(allow|expect)\(' \
              crate/src crate/tests --include='*.rs'; then
            echo 'Inline #[allow]/#[expect] found — fix the lint, or add a commented'
            echo 'relaxation to [lints.clippy] or [lints.rust] in crate/Cargo.toml.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi
      # The rule lives in scripts/check-agent-files.py, which the extension repos
      # run from their vitest suite. It was written twice once — here and there —
      # which is "define it once" broken inside the gate that enforces the
      # family's rules, and the two had already diverged.
      - name: The agent instruction files are one document
        working-directory: .
        run: python3 scripts/check-agent-files.py

  # AGENTS.md sets a 90% line coverage floor per module for extract/.
  # Enforced per module, not on the total: a total hides one module sliding
  # while the others carry it. Scoped to extract/ because everything else
  # is I/O verified by the contract job.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is exactly
        # when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on extract/
        run: |
          python3 - <<'PY'
          import json, sys
          # A backstop against a module nobody tested, not a target. It sits
          # well below where the code actually is — the lowest measured module
          # in the family was 92.69% against the old 90.0 floor, i.e. 2.69
          # points from failing a build over a single new branch. A floor that
          # tracks actual coverage stops being a floor and becomes a tax on
          # writing the next module. Do not raise this to chase a number.
          FLOOR = 75.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          measured = 0
          for f in files:
              if "/extract/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              measured += 1
              print(f"{name:20} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          # Zero matches is not zero failures. Rename the directory and the
          # filter above stops matching, the loop never runs, and the job
          # reports success having checked nothing at all.
          if measured == 0:
              print("No modules matched the coverage filter — the job checked nothing.")
              sys.exit(1)
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in extract/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - run: cargo audit

  # ---------------------------------------------------------------------
  # The five below exist because something real got through a green suite.
  # Each one names the bug it would have caught.
  #
  # **None of them touches the network**, which is a stronger claim here
  # than in any sibling: this crate says what an address *is*, and a tool
  # that found out by asking a resolver would make its answer depend on
  # the network the auditor happened to be sitting on. Everything below
  # runs on bytes, on disk or on stdin.
  # ---------------------------------------------------------------------

  # Inputs a real machine holds and a fixture directory cannot: a
  # byte-order mark, bytes that are not UTF-8, a UTF-16 log, a FIFO, a
  # symlink loop, a path over 260 characters, a minified JSON document of
  # several megabytes. The tree is built at runtime because Windows cannot
  # check half of it into git, and every case the platform cannot express
  # is skipped by name rather than passed quietly.
  #
  # Found in this release: one locked directory ended the whole run with
  # exit 2 and an empty report, deleting the audit of every readable file
  # beside it.
  hazards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous inputs against the built binary
        run: cargo test --locked --test hazards

  # Behaviour that differs by operating system. envsync-le shipped a
  # release whose report used `\` on Windows and `/` everywhere else, so
  # the whole family now asserts it — a report is diffed between machines
  # and read by someone who does not have the tree.
  #
  # Found in this release: report paths were `path.to_string_lossy()`
  # straight through, so every path in a Windows report would have carried
  # backslashes.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Separators, case folding, reserved names, CRLF and stdin
        run: cargo test --locked --test platform
      # Windows ignores TZ entirely, so a suite that quietly depended on
      # it would be red there and nowhere else. Both runs are compared
      # line for line rather than merely required to pass.
      - name: The suite answers the same with TZ set and unset
        shell: bash
        run: |
          set -euo pipefail
          # Names and outcomes, not the summary lines: those carry a
          # duration, and two runs of the same suite never agree on one.
          names() { grep -E '^test ' | grep -v '^test result:' | sort; }
          TZ=UTC cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-utc.txt"
          unset TZ
          cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-unset.txt"
          test -s "$RUNNER_TEMP/tz-utc.txt"
          diff -u "$RUNNER_TEMP/tz-utc.txt" "$RUNNER_TEMP/tz-unset.txt"

  # The corpus pins cases somebody thought of; this generates the ones
  # nobody did and feeds them to `extract_ips`, the MCP tool that takes
  # document text and reads no file.
  #
  # The target is the scanner's three splitting rules — run-glued-to-a-name,
  # colon-splits-unless-IPv6-shaped, hyphen-splits-unless-MAC. Each one
  # slices a byte range out of text somebody else wrote, so a slice off a
  # character boundary is a panic and a rule that does not terminate is a
  # CI job that never ends. Every generated document also carries
  # `0177.0.0.99`, and neither of its two readings may appear in any
  # answer on either stream — the octal hazard has to hold under generated
  # input, not only under the cases somebody thought of.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      IPS_LE_FUZZ_SECONDS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Sixty seconds against the scanner's splitting rules
        run: cargo test --locked --test fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling on a corpus generated from a fixed seed, plus
  # three linearity checks: four times the files, four times the addresses
  # in one file, and four times the addresses on one **non-ASCII** line.
  #
  # The third is the one that matters. `PositionIndex` reports a column in
  # UTF-16 code units and used to count them from the line start on every
  # lookup; an ASCII document took an arithmetic fast path, so the cost
  # only appeared on a long line holding a `café` — 20,000 addresses took
  # 62 s where 5,000 took 3.7 s. A long-line case written in ASCII, which
  # is what a sibling has, never reaches it.
  budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      IPS_LE_BUDGET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: 500 files inside the budget, and linear in all three directions
        run: cargo test --locked --test budget -- --test-threads=1 --nocapture

  # Does the crate open what it claims?
  #
  # Every kind, every class, every refusal reason and every advertised
  # format has to be reachable from a real fixture through the walk and
  # the built binary — and nothing the code produces may be missing from
  # those lists. A class nothing reaches is a class this tool claims and
  # has never produced; a value produced and undocumented is a report that
  # describes nine classes and ships ten.
  #
  # The marker check is not decoration: `cargo test <filter>` exits 0 when
  # the filter matches nothing, so a renamed test would pass this job
  # silently.
  coverage-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every kind, class, refusal reason and format reader
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test coverage_matrix -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 4 kinds, 10 classes, 6 refusal reasons' \
            "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 8 format readers' "$RUNNER_TEMP/coverage-matrix.txt"

  # A gated tier is a tier that does not run. `versions-le` shipped a
  # scenarios suite that had never been executed once — it asserted a shape
  # the code stopped producing — because nothing ever set its variable.
  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: The gated scenario tier
        env:
          IPS_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1

  # The commit convention was claimed by .githooks/commit-msg and by
  # AGENTS.md, and enforced by neither: core.hooksPath is opt-in per
  # clone, so `--no-verify` or a fresh checkout skipped it permanently
  # rather than deferring it. Three separate audits flagged the same
  # false claim. This is the gate that makes it true.
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every pushed commit is conventional
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._,/ -]+\))?!?: .+'
          fail=0
          while read -r sha subject; do
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "not conventional: $sha $subject"; fail=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              echo "subject is ${#subject} chars, limit 72: $sha $subject"; fail=1
            fi
          done < <(git log --no-merges --format='%h %s' "$base..HEAD")
          exit $fail
